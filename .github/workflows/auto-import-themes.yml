name: Weekly Auto-Import Community Themes

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-themes:
    name: Audit & Import Community Themes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run Auto Theme Importer
        run: |
          python tools/auto-import-themes.py

      - name: Commit and Push New Themes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(themes): weekly auto-import of community themes"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
