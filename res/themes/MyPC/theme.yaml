---
display:
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 0, 0

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

static_text:
