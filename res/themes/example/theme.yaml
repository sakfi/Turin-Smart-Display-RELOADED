# See the wiki to edit this file: https://github.com/mathoudebine/turing-smart-screen-python/wiki/System-monitor-:-themes

---

author: "Cold Storage"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: portrait


static_images:
  # Specify what static images we want to show on the display
  # You can create additional records here, the name of the entry must be unique and contain at a minimum the PATH.
  # Images are drawn in the order they are listed below, the top image will be drawn first (so places images back to front)
  # IMAGE_NAME:
  #   PATH:
  #   X:
  #   Y:
  #   WIDTH:
  #   HEIGHT:
  BACKGROUND:
    PATH: black-white5.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480

STATS:
  DATE:
    INTERVAL: 1
    DAY:
      TEXT:
        FORMAT: short
        SHOW: true
        X: 49
        Y: 7
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 17
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: black-white5.png
    HOUR:
      TEXT:
        FORMAT: short
        SHOW: true
        X: 141
        Y: 11
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 38
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: black-white5.png
  CPU:
    INTERVAL: 5
    FREQUENCY:
      TEXT:
        SHOW: true
        SHOW_UNIT: false
        X: 114
        Y: 91
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: black-white5.png
    FAN_SPEED:
      TEXT:
        SHOW: true
        SHOW_UNIT: false
        X: 126
        Y: 114
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: black-white5.png
    PERCENTAGE:
