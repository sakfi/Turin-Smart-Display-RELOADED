        SHOW: true
        SHOW_UNIT: false
        X: 126
        Y: 140
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: black-white5.png
      GRAPH:
