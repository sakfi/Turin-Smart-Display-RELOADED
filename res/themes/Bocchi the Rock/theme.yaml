        AXIS_FONT: roboto/Roboto-Black.ttf
        AXIS_FONT_SIZE: 22
        # BACKGROUND_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png
    
    TEMPERATURE:
