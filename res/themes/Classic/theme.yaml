    INTERVAL: 10
    VIRTUAL:
      GRAPH:
        SHOW: True
        X: 3
        Y: 255
        WIDTH: 314
        HEIGHT: 13
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 133, 246, 255
        BAR_OUTLINE: true
        BACKGROUND_COLOR: 0, 0, 0
      TOTAL:
        SHOW: true
        SHOW_UNIT: True
        X: 195
        Y: 224
        FONT: MOREPERFECTDOSVGA.ttf
        FONT_SIZE: 25
        FONT_COLOR: 133, 246, 255
        # BACKGROUND_COLOR: 132, 154, 165
        BACKGROUND_IMAGE: background.png 
      USED:
        SHOW: true
        SHOW_UNIT: false
        X: 99
        Y: 224
        FONT: MOREPERFECTDOSVGA.ttf
        FONT_SIZE: 25
        FONT_COLOR: 133, 246, 255
        # BACKGROUND_COLOR: 132, 154, 165
        BACKGROUND_IMAGE: background.png  
