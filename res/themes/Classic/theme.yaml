   X: 3
   Y: 385
   FONT: MOREPERFECTDOSVGA.ttf
   FONT_SIZE: 25
   FONT_COLOR: 255, 254, 84
   BACKGROUND_IMAGE: background.png
STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 2
      LINE_GRAPH:
        SHOW: True
        X: 3
        Y: 31
        WIDTH: 314
        HEIGHT: 75
        MIN_VALUE: 0
        MAX_VALUE: 100
        HISTORY_SIZE: 60
        AUTOSCALE: false
        LINE_COLOR: 133, 246, 255
        AXIS: True
        AXIS_COLOR: 133, 246, 255
        BACKGROUND_IMAGE: background.png
    FREQUENCY:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 110
        Y: 3
        FONT: MOREPERFECTDOSVGA.ttf
        FONT_SIZE: 25
        FONT_COLOR: 133, 246, 255
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 238
        Y: 3
        FONT: MOREPERFECTDOSVGA.ttf
        FONT_SIZE: 25
        FONT_COLOR: 133, 246, 255
        BACKGROUND_IMAGE: background.png
  GPU:
    INTERVAL: 2
    FREQUENCY:
      TEXT:
        SHOW: true
        SHOW_UNIT: True
        X: 111
        Y: 118
        FONT: MOREPERFECTDOSVGA.ttf
        FONT_SIZE: 25
        FONT_COLOR: 133, 246, 255
        #BACKGROUND_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png
    PERCENTAGE:
      LINE_GRAPH:
        SHOW: true
        X: 3
        Y: 139
        WIDTH: 314
        HEIGHT: 75
        MIN_VALUE: 0
        MAX_VALUE: 100
        HISTORY_SIZE: 60
        AUTOSCALE: False
        LINE_COLOR: 133, 246, 255
        AXIS: True
        AXIS_COLOR: 133, 246, 255
        BACKGROUND_IMAGE: background.png
    MEMORY:
      GRAPH:
        SHOW: false
        X: 115
        Y: 215
        WIDTH: 178
        HEIGHT: 13
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 133, 246, 255
        BAR_OUTLINE: False
        BACKGROUND_COLOR: 0, 0, 0
