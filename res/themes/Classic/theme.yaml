---
#This theme is using MOREPERFECTDOSVGA.ttf font. 
#You can download it here: https://laemeur.sdf.org/fonts/
#Place MorePerfectDOSVGA.ttf file in 'turing-smart-screen-python-3.5.0\resres\fonts' folder.

author: "cactuz9"

display:
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 0, 0, 0

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480
static_text:
  TEXT_CPU:
   TEXT: CPU
   X: 3
   Y: 3
   FONT: MOREPERFECTDOSVGA.ttf
   FONT_SIZE: 25
   FONT_COLOR: 255, 254, 84
   BACKGROUND_IMAGE: background.png
  TEXT_GPU:
   TEXT: GPU
   X: 3
   Y: 118
   FONT: MOREPERFECTDOSVGA.ttf
   FONT_SIZE: 25
   FONT_COLOR: 255, 254, 84
   BACKGROUND_IMAGE: background.png
  TEXT_RAM:
   TEXT: RAM
   X: 3
   Y: 224
   FONT: MOREPERFECTDOSVGA.ttf
   FONT_SIZE: 25
   FONT_COLOR: 255, 254, 84
   BACKGROUND_IMAGE: background.png
  TEXT_RAM/:
   TEXT: /
   X: 175
   Y: 226
   FONT: MOREPERFECTDOSVGA.ttf
   FONT_SIZE: 25
   FONT_COLOR: 133, 246, 255
   BACKGROUND_IMAGE: background.png
