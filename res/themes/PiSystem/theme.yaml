# This theme is intended for a Headless Raspberry Pi or similar Linux devices.
# It uses the new Custom device interfaces to gain information from the Pi
# Special Note it requires the install psutil (pip install psutil) for the 
# sensor_custom.py to work
---
author: "MarkO"

display:
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 61, 184, 225

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

