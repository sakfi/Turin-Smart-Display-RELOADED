STATS:
  DATE:
    INTERVAL: 1
    HOUR:
      TEXT:
        SHOW: True
        X: 180
        Y: 6
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 200, 200, 200
        BACKGROUND_IMAGE: background.png
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      RADIAL:
        SHOW: True
        X: 94
        Y: 110
        RADIUS: 46
        WIDTH: 13
        MIN_VALUE: 0
        MAX_VALUE: 99
        ANGLE_START: 150
        ANGLE_END: 30
        ANGLE_STEPS: 25
        ANGLE_SEP: 5
        CLOCKWISE: True
        BAR_COLOR: 250, 138, 24
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
    FREQUENCY:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 46
        Y: 156
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 18
        FONT_COLOR: 250, 138, 24
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 58
        Y: 178
        FONT: generale-mono/GeneraleMonoC.ttf
        FONT_SIZE: 18
        FONT_COLOR: 200, 200, 200
        BACKGROUND_IMAGE: background.png
  MEMORY:
     INTERVAL: 3
     VIRTUAL:
       RADIAL:
        SHOW: True
        X: 240
        Y: 110
        RADIUS: 46
        WIDTH: 13
        MIN_VALUE: 0
        MAX_VALUE: 99
        ANGLE_START: 150
        ANGLE_END: 30
        ANGLE_STEPS: 25
        ANGLE_SEP: 5
        CLOCKWISE: True
        BAR_COLOR: 250, 138, 24
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: generale-mono/GeneraleMonoA.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
       USED:
        SHOW: True
        SHOW_UNIT: True
        X: 200
        Y: 156
        FONT: generale-mono/GeneraleMonoC.ttf
        FONT_SIZE: 18
        FONT_COLOR: 250, 138, 24
        BACKGROUND_IMAGE: background.png
