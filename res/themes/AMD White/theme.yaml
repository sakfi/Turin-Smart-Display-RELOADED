---
author: "@DonAlcasan"

display:
  DISPLAY_SIZE: 8.8"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 224, 2, 48

static_images:
  BACKGROUND:
    PATH:  background.png
    X: 0
    Y: 0
    WIDTH: 1920
    HEIGHT: 480

static_text:
  CPU:
   TEXT: CPU
   X: 1580
   Y: 70
   FONT: roboto-mono/RobotoMono-Bold.ttf
   FONT_SIZE: 70
   FONT_COLOR: 224, 2, 48
   BACKGROUND_IMAGE: background.png
  RAM:
   TEXT: RAM
   X: 1580
   Y: 220
   FONT: roboto-mono/RobotoMono-Bold.ttf
   FONT_SIZE: 70
   FONT_COLOR: 224, 2, 48
   BACKGROUND_IMAGE: background.png
  GPU:
   TEXT: GPU
   X: 58
   Y: 66
   FONT: roboto-mono/RobotoMono-Bold.ttf
   FONT_SIZE: 80
   FONT_COLOR: 224, 2, 48
   BACKGROUND_IMAGE: background.png
  TIME:
   TEXT: TIME
   X: 1500
   Y: 373
   FONT: roboto-mono/RobotoMono-Bold.ttf
   FONT_SIZE: 36
   FONT_COLOR: 255, 255, 255
   BACKGROUND_IMAGE: background.png

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      RADIAL:
        SHOW: True
        X: 1800
        Y: 92
        RADIUS: 68
        WIDTH: 18
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 110
        ANGLE_END: 70
        ANGLE_STEPS: 1
        ANGLE_SEP: 25
        CLOCKWISE: True
        BAR_COLOR: 224, 2, 48
        BAR_BACKGROUND_COLOR:  200, 200, 200
        DRAW_BAR_BACKGROUND: True
        BAR_DECORATION: Ellipse
        SHOW_TEXT: True
        SHOW_UNIT: False
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 59
        FONT_COLOR: 0, 0, 0
        TEXT_OFFSET: [-17, 0]
        BACKGROUND_IMAGE: background.png

    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 1549
        Y: 130
        FONT: roboto-mono/RobotoMono-Medium.ttf
        FONT_SIZE: 52
        FONT_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png

  GPU:
    INTERVAL: 1
    PERCENTAGE:
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 18
        Y: 153
        FONT: roboto-mono/RobotoMono-Medium.ttf
        FONT_SIZE: 170
        FONT_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 200
        Y: 67
        FONT: roboto-mono/RobotoMono-Medium.ttf
        FONT_SIZE: 75
        FONT_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png

  MEMORY:
    INTERVAL: 1
    VIRTUAL:
      PERCENTAGE:
      RADIAL:
        SHOW: True
        X: 1800
        Y: 245
        RADIUS: 68
        WIDTH: 18
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 110
        ANGLE_END: 70
        ANGLE_STEPS: 1
        ANGLE_SEP: 25
        CLOCKWISE: True
        BAR_COLOR: 224, 2, 48
        BAR_BACKGROUND_COLOR:  200, 200, 200
        DRAW_BAR_BACKGROUND: True
        BAR_DECORATION: Ellipse
        SHOW_TEXT: True
        SHOW_UNIT: False
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 59
        FONT_COLOR: 0, 0, 0
        TEXT_OFFSET: [-17, 0]
        BACKGROUND_IMAGE: background.png


  DATE:
    # For time display, it is recommended not to change the interval: keep to 1
    INTERVAL: 1
    HOUR: # Format (12/24h, timezone translations) will match your computer locale
      TEXT:
        FORMAT: HH:mm:ss # short (6:48 PM) / medium (6:48:53 PM) / long (6:48:53 PM UTC) / full (6:48:53 PM Coordinated Universal Time) / custom pattern e.g. "HH:mm:ss zzz" (6:48:53 EDT)
        SHOW: True
        X: 1620
        Y: 382
        WIDTH: 280
        HEIGHT: 56
        FONT: roboto/Roboto-Medium.ttf
        FONT_SIZE: 70
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left  # left / center / right
        ANCHOR: rt   # Check https://pillow.readthedocs.io/en/stable/handbook/text-anchors.html
