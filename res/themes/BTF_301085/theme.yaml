---
author: "@EnzoZarx"

# Change backgroundfr.png to backgrounden.png if you want English translation.
define: &background 'backgroundfr.png'

display:
  # Made for 3.5", not tested on 5".
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 156, 20, 19

static_images:
  BACKGROUND:
    PATH: *background
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320
    
static_text:
  CPU_MODEL:
    # Set your CPU brand.
    TEXT: INTEL
    X: 217
    Y: 8
    WIDTH: 66
    HEIGHT: 12
    FONT: bahnschrift-light/BAHNSCHRIFT.ttf
    FONT_SIZE: 16
    FONT_COLOR: 255, 255, 255
    BACKGROUND_IMAGE: *background
    ALIGN: center
