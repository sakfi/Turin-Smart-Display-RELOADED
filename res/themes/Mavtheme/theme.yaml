---
author: "@MorbidMav"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 255, 164, 200

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      RADIAL:
        SHOW: True
        X: 160
        Y: 170
        RADIUS: 81
        WIDTH: 20
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: -90
        ANGLE_END: 270
        ANGLE_STEPS: 20
        ANGLE_SEP: 5
        CLOCKWISE: True
        BAR_COLOR: 20, 198, 253
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: spatial-mono/MonoSpatial.ttf
        FONT_SIZE: 30
        FONT_COLOR: 20, 198, 253
        BACKGROUND_IMAGE: background.png        
    FREQUENCY:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 141
        Y: 130
        FONT: spatial-mono/MonoSpatial.ttf
        FONT_SIZE: 12
        FONT_COLOR: 255, 164, 200
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 3
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 140
        Y: 200            
        FONT: spatial-mono/MonoSpatial.ttf
        FONT_SIZE: 20
        FONT_COLOR: 255, 164, 200
        BACKGROUND_IMAGE: background.png
