    X: 40
    Y: 13
    WIDTH: 80
    HEIGHT: 0
    FONT: custom\arial.ttf
    FONT_SIZE: 8
    FONT_COLOR: 70, 20, 20
    ALIGN: center
    ANCHOR: mt
    ROTATION: 0
    BACKGROUND_IMAGE: background.png

  LOAD_LABEL:
    TEXT: "LOAD"
    X: 14
    Y: 88
    WIDTH: 0
    HEIGHT: 0
    FONT: custom\arialbd.ttf
    FONT_SIZE: 11
    FONT_COLOR: 255, 170, 0
    ALIGN: left
    ANCHOR: lt
    ROTATION: 0
    BACKGROUND_IMAGE: background.png

  DIVIDER_MID:
    TEXT: "__________________"
    X: 40
    Y: 101
    WIDTH: 80
    HEIGHT: 0
    FONT: custom\arial.ttf
    FONT_SIZE: 8
    FONT_COLOR: 70, 20, 20
    ALIGN: center
    ANCHOR: mt
    ROTATION: 0
    BACKGROUND_IMAGE: background.png

  VRAM_LABEL:
    TEXT: "VRAM"
    X: 6
    Y: 115
    WIDTH: 0
    HEIGHT: 0
    FONT: custom\arialbd.ttf
    FONT_SIZE: 12
    FONT_COLOR: 160, 160, 160
    ALIGN: left
    ANCHOR: lt
    ROTATION: 0
    BACKGROUND_IMAGE: background.png

  CLOCK_LABEL:
    TEXT: "CLOCK"
    X: 6
