    X: 40
    Y: 5
    WIDTH: 80
    HEIGHT: 0
    FONT: custom\arialbd.ttf
    FONT_SIZE: 9
    FONT_COLOR: 255, 68, 68
    ALIGN: center
    ANCHOR: mt
    ROTATION: 0
    BACKGROUND_IMAGE: background.png

  DIVIDER_TOP:
