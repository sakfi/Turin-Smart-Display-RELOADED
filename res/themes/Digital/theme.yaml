---
display:
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 0, 0, 0
static_images:
  BACKGROUND:
    PATH: background_digital.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480
STATS:
  CPU:
    PERCENTAGE:
      # In seconds. Longer intervals cause this to refresh more slowly.
      # Setting to lower values will display near real time data,
      # but may cause significant CPU usage or the display not to update properly
      INTERVAL: 1  
      GRAPH:
        SHOW: True
        X: 105
        Y: 218
        WIDTH: 185
        HEIGHT: 25
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 248, 195, 34
        BAR_OUTLINE: True
        # BACKGROUND_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background_digital.png 
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: False
        X: 23
        Y: 80
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 200
        FONT_COLOR: 248, 195, 34
        # BACKGROUND_COLOR: 132, 154, 165
        BACKGROUND_IMAGE: background_digital.png
  GPU:
    PERCENTAGE:
      # In seconds. Longer intervals cause this to refresh more slowly.
      # Setting to lower values will display near real time data,
      # but may cause significant CPU usage or the display not to update properly
      INTERVAL: 1  
      GRAPH:
        SHOW: True
        X: 105
        Y: 448
        WIDTH: 185
        HEIGHT: 25
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 20, 240, 116
        BAR_OUTLINE: True
        # BACKGROUND_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background_digital.png   
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: True
        SHOW_UNIT: False
        X: 23
        Y: 309
        FONT: digital/DIGITAL-7.TTF
        FONT_SIZE: 200
        FONT_COLOR: 20, 240, 116
        # BACKGROUND_COLOR: 132, 154, 165
        BACKGROUND_IMAGE: background_digital.png        